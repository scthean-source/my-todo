<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List (เก็บข้อมูลบน Supabase)</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; padding: 24px; }
    .card { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 12px;
            padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 1.4rem; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"], input[type="email"], input[type="password"] {
      flex: 1; padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; }
    button { padding: 10px 14px; font-size: 1rem; border: 0; border-radius: 8px; cursor: pointer; }
    .add { background: #2563eb; color: #fff; }
    .secondary { background: #e5e7eb; color: #111; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
    li span { flex: 1; }
    li.done span { text-decoration: line-through; color: #888; }
    .del { background: #fee2e2; color: #b91c1c; padding: 6px 10px; }
    #status { margin: 8px 0; font-size: .9rem; color: #555; }
    #status.error { color: #b91c1c; }
    .hidden { display: none !important; }
    #auth-form { flex-direction: column; }
    #auth-form .buttons { display: flex; gap: 8px; }
    #auth-form .buttons button { flex: 1; }
    .userbar { display: flex; align-items: center; justify-content: space-between; gap: 8px;
               margin-bottom: 16px; font-size: .9rem; color: #555; }
    .userbar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .userbar button { padding: 6px 10px; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>To-Do List</h1>

    <!-- ส่วนที่ 1: ยังไม่ล็อกอิน -->
    <div id="auth-view" class="hidden">
      <form id="auth-form">
        <input type="email" id="auth-email" placeholder="อีเมล" autocomplete="email" required>
        <input type="password" id="auth-password" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัว)"
               autocomplete="current-password" minlength="6" required>
        <div class="buttons">
          <button class="add" type="submit" id="btn-login">เข้าสู่ระบบ</button>
          <button class="secondary" type="button" id="btn-signup">สมัครสมาชิก</button>
        </div>
      </form>
    </div>

    <!-- ส่วนที่ 2: ล็อกอินแล้ว -->
    <div id="app-view" class="hidden">
      <div class="userbar">
        <span id="user-email"></span>
        <button class="secondary" type="button" id="btn-logout">ออกจากระบบ</button>
      </div>
      <form id="add-form">
        <input type="text" id="new-title" placeholder="อยากทำอะไร..." required>
        <button class="add" type="submit">เพิ่ม</button>
      </form>
    </div>

    <div id="status"></div>
    <ul id="todo-list"></ul>
  </div>

  <!-- โหลดไลบรารี Supabase (ตัวช่วยคุยกับ database) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ====== 1) ใส่ค่าของคุณตรงนี้ (ดูวิธีหาในคู่มือ ขั้นที่ 4) ======
    const SUPABASE_URL = "https://extuhgkbnlkxdkhbqluq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_jbjuUOtmVw3hIiGV0ZZejw_pbogV3zw"; // ขึ้นต้นด้วย sb_publishable_
    // ห้ามใส่ secret key / service_role key ที่นี่เด็ดขาด
    // ==============================================================

    // สร้างตัวเชื่อมต่อกับ database
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const listEl = document.getElementById("todo-list");
    const statusEl = document.getElementById("status");
    const formEl = document.getElementById("add-form");
    const inputEl = document.getElementById("new-title");

    const authViewEl = document.getElementById("auth-view");
    const appViewEl = document.getElementById("app-view");
    const authFormEl = document.getElementById("auth-form");
    const emailEl = document.getElementById("auth-email");
    const passwordEl = document.getElementById("auth-password");
    const userEmailEl = document.getElementById("user-email");

    function showStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError ? "error" : "";
    }

    // แปลข้อความ error ของ Supabase Auth เป็นภาษาไทยที่อ่านง่าย
    function authErrorMessage(error) {
      const msg = (error.message || "").toLowerCase();
      if (msg.includes("invalid login credentials")) return "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
      if (msg.includes("already registered")) return "อีเมลนี้สมัครไว้แล้ว ลองเข้าสู่ระบบแทน";
      if (msg.includes("at least") && msg.includes("characters")) return "รหัสผ่านสั้นเกินไป (อย่างน้อย 6 ตัวอักษร)";
      if (msg.includes("email not confirmed")) return "ยังไม่ได้ยืนยันอีเมล โปรดตรวจกล่องจดหมายของคุณ";
      if (msg.includes("rate limit")) return "ลองบ่อยเกินไป โปรดรอสักครู่แล้วลองใหม่";
      if (msg.includes("invalid") && msg.includes("email")) return "รูปแบบอีเมลไม่ถูกต้อง";
      return error.message;
    }

    // สลับหน้าจอ: มี session = ล็อกอินแล้ว / ไม่มี = หน้าล็อกอิน
    function showSignedIn(user) {
      userEmailEl.textContent = user.email;
      authViewEl.classList.add("hidden");
      appViewEl.classList.remove("hidden");
    }

    function showSignedOut() {
      listEl.innerHTML = ""; // ล้างรายการ กันข้อมูลของคนก่อนหน้าค้างบนจอ
      userEmailEl.textContent = "";
      appViewEl.classList.add("hidden");
      authViewEl.classList.remove("hidden");
      showStatus("");
    }

    // ดึงรายการทั้งหมดจาก database แล้วแสดงบนหน้าจอ
    // (ฐานข้อมูลส่งกลับมาเฉพาะรายการของคนที่ล็อกอิน เพราะมีกฎ RLS คุมอยู่)
    async function loadTodos() {
      showStatus("กำลังโหลด...");
      const { data, error } = await db
        .from("todos")
        .select("*")
        .order("created_at", { ascending: true });

      if (error) {
        showStatus("โหลดไม่สำเร็จ: " + error.message, true);
        return;
      }
      showStatus(data.length === 0 ? "ยังไม่มีรายการ ลองเพิ่มดูสิ" : "");
      renderTodos(data);
    }

    // วาดรายการลงหน้าเว็บ
    function renderTodos(todos) {
      listEl.innerHTML = "";
      for (const todo of todos) {
        const li = document.createElement("li");
        if (todo.done) li.className = "done";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.addEventListener("change", () => toggleTodo(todo.id, checkbox.checked));

        const text = document.createElement("span");
        text.textContent = todo.title; // ใช้ textContent เพื่อความปลอดภัย

        const delBtn = document.createElement("button");
        delBtn.className = "del";
        delBtn.textContent = "ลบ";
        delBtn.addEventListener("click", () => deleteTodo(todo.id));

        li.append(checkbox, text, delBtn);
        listEl.appendChild(li);
      }
    }

    // ===== ระบบสมาชิก =====

    // เข้าสู่ระบบ (กดปุ่ม "เข้าสู่ระบบ" / กด Enter ในฟอร์ม)
    authFormEl.addEventListener("submit", async (event) => {
      event.preventDefault();
      showStatus("กำลังเข้าสู่ระบบ...");
      const { error } = await db.auth.signInWithPassword({
        email: emailEl.value.trim(),
        password: passwordEl.value,
      });
      if (error) {
        showStatus(authErrorMessage(error), true);
        return;
      }
      passwordEl.value = ""; // หน้าจอจะสลับเองผ่าน onAuthStateChange
    });

    // สมัครสมาชิก
    document.getElementById("btn-signup").addEventListener("click", async () => {
      if (!authFormEl.reportValidity()) return; // ให้เบราว์เซอร์เช็กอีเมล/รหัสผ่านก่อน
      showStatus("กำลังสมัครสมาชิก...");
      const { data, error } = await db.auth.signUp({
        email: emailEl.value.trim(),
        password: passwordEl.value,
      });
      if (error) {
        showStatus(authErrorMessage(error), true);
        return;
      }
      passwordEl.value = "";
      // ถ้าเปิด "Confirm email" ไว้ จะยังไม่มี session จนกว่าจะกดลิงก์ในอีเมล
      if (!data.session) {
        showStatus("สมัครสำเร็จ! โปรดตรวจอีเมลแล้วกดลิงก์ยืนยันก่อนเข้าสู่ระบบ");
      }
    });

    // ออกจากระบบ
    document.getElementById("btn-logout").addEventListener("click", async () => {
      const { error } = await db.auth.signOut();
      if (error) showStatus("ออกจากระบบไม่สำเร็จ: " + error.message, true);
    });

    // ตัวเดียวที่คุมการสลับหน้า: ทำงานตอนเปิดเว็บ (INITIAL_SESSION), ล็อกอิน, ออกจากระบบ
    db.auth.onAuthStateChange((event, session) => {
      if (session) {
        showSignedIn(session.user);
        // ใช้ setTimeout เพื่อไม่ให้เรียก database ซ้อนใน callback (แนะนำโดย Supabase)
        if (event !== "TOKEN_REFRESHED") setTimeout(loadTodos, 0);
      } else {
        showSignedOut();
      }
    });

    // ===== รายการ To-Do =====

    // เพิ่มรายการใหม่ (user_id ฐานข้อมูลเติมให้เองจากคนที่ล็อกอินอยู่)
    formEl.addEventListener("submit", async (event) => {
      event.preventDefault();
      const title = inputEl.value.trim();
      if (!title) return;

      const { error } = await db.from("todos").insert({ title });
      if (error) {
        showStatus("เพิ่มไม่สำเร็จ: " + error.message, true);
        return;
      }
      inputEl.value = "";
      loadTodos();
    });

    // ติ๊กว่าเสร็จแล้ว / ยังไม่เสร็จ
    async function toggleTodo(id, done) {
      const { error } = await db.from("todos").update({ done }).eq("id", id);
      if (error) showStatus("อัปเดตไม่สำเร็จ: " + error.message, true);
      loadTodos();
    }

    // ลบรายการ
    async function deleteTodo(id) {
      const { error } = await db.from("todos").delete().eq("id", id);
      if (error) showStatus("ลบไม่สำเร็จ: " + error.message, true);
      loadTodos();
    }

    // หมายเหตุ: ไม่เรียก loadTodos() ตรงนี้แล้ว — onAuthStateChange จะเรียกให้หลังรู้ว่าล็อกอินอยู่
  </script>
</body>
</html>
